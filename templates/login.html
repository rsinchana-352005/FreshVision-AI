
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | FreshVision AI</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body class="auth-page">

    <div class="auth-container">
        <div class="auth-brand">
            <a href="/" class="brand-logo">
                <i data-lucide="leaf"></i>
                <span>FreshVision<span class="brand-accent"> AI</span></span>
            </a>
        </div>

        <div class="auth-card">
            <div class="auth-heading">
                <div class="auth-icon">
                    <i data-lucide="user-round"></i>
                </div>
                <h1>Welcome Back</h1>
                <p>Sign in to continue your research journey.</p>
            </div>

            <form id="loginForm">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <div class="input-wrapper">
                        <i data-lucide="mail"></i>
                        <input type="email" id="email" name="email"
                               placeholder="Enter your email" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="input-wrapper">
                        <i data-lucide="lock"></i>
                        <input type="password" id="password" name="password"
                               placeholder="Enter your password" required>
                        <button type="button" id="togglePassword"
                                class="password-toggle" aria-label="Show password">
                            <i data-lucide="eye"></i>
                        </button>
                    </div>
                </div>

                <p id="loginMessage" class="auth-message"></p>

                <button type="submit" id="loginButton" class="auth-submit">
                    Sign In <i data-lucide="arrow-right"></i>
                </button>
            </form>

            <div class="auth-footer">
                <p>Don't have an account?
                    <a href="/register">Create Account</a>
                </p>
                <a href="/" class="back-home">
                    <i data-lucide="arrow-left"></i> Back to Home
                </a>
            </div>
        </div>

        <p class="auth-copyright">
            © 2026 FreshVision AI. Research and Innovation.
        </p>
    </div>

    <script>
        lucide.createIcons();
    </script>
    <script src="{{ url_for('static', filename='js/login.js') }}"></script>
</body>
</html>
