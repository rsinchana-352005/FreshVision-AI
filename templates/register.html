
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | FreshVision AI</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body class="auth-page">

    <div class="auth-container">
        <div class="auth-brand">
            <a href="/" class="brand-logo">
                <i data-lucide="leaf"></i>
                <span>FreshVision<span class="brand-accent"> AI</span></span>
            </a>
        </div>

        <div class="auth-card">
            <div class="auth-heading">
                <div class="auth-icon">
                    <i data-lucide="user-plus"></i>
                </div>
                <h1>Create Account</h1>
                <p>Join FreshVision AI and explore intelligent food quality research.</p>
            </div>

            <form id="registerForm">

                <div class="form-group">
                    <label for="name">Full Name</label>
                    <div class="input-wrapper">
                        <i data-lucide="user"></i>
                        <input type="text" id="name" name="name"
                               placeholder="Enter your full name" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <div class="input-wrapper">
                        <i data-lucide="mail"></i>
                        <input type="email" id="email" name="email"
                               placeholder="Enter your email" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="institution">Institution / Organization</label>
                    <div class="input-wrapper">
                        <i data-lucide="building-2"></i>
                        <input type="text" id="institution" name="institution"
                               placeholder="Enter your institution" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="password">Create Password</label>
                    <div class="input-wrapper">
                        <i data-lucide="lock"></i>
                        <input type="password" id="password" name="password"
                               placeholder="Create a password" required minlength="8">
                    </div>
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Confirm Password</label>
                    <div class="input-wrapper">
                        <i data-lucide="shield-check"></i>
                        <input type="password" id="confirmPassword"
                               placeholder="Re-enter your password" required minlength="8">
                    </div>
                </div>

                <p id="registerMessage" class="auth-message"></p>

                <button type="submit" id="registerButton" class="auth-submit">
                    Create Account <i data-lucide="arrow-right"></i>
                </button>

            </form>

            <div class="auth-footer">
                <p>Already have an account?
                    <a href="/login">Sign In</a>
                </p>

                <a href="/" class="back-home">
                    <i data-lucide="arrow-left"></i> Back to Home
                </a>
            </div>
        </div>

        <p class="auth-copyright">
            © 2026 FreshVision AI. Research and Innovation.
        </p>
    </div>

    <script>
        lucide.createIcons();
    </script>
    <script src="{{ url_for('static', filename='js/register.js') }}"></script>
</body>
</html>
